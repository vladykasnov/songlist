name: Обновить резервный каталог

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Установить парсер данных витрины
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Забрать публичный каталог
        run: node scripts/update-snapshot.mjs
      - name: Опубликовать снимок
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalog-snapshot.json songs.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Обновить резервный каталог песен'
          git push
      # Коммит от GITHUB_TOKEN сам по себе не запускает сборку Pages.
      - name: Пересобрать GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body -sS -o /dev/null -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds"
